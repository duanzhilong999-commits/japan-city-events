name: 每日刷新活动数据

on:
  schedule:
    # 每天 19:10 UTC = 次日 04:10 日本时间
    - cron: "10 19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取 12 城市
        run: python -m app.cli collect --city all

      - name: 统计
        run: python -m app.cli stats || true

      - name: 提交数据库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/events.db
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 每日刷新活动数据 $(date -u '+%Y-%m-%d')"
            git push
          fi
